<style>
*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#f7f1e8,#eadfce);
  padding:20px;
}
.card{
  background:#fff;
  width:min(430px,100%);
  padding:38px;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(78,52,33,.18);
  text-align:center;
}
.logo{width:220px;max-width:100%;margin-bottom:8px}
h1{margin:8px 0 6px;color:#5b3b26}
p{color:#6f6258;margin:0 0 24px}
input{
  width:100%;
  padding:14px;
  border:1px solid #d8cfc5;
  border-radius:12px;
  font-size:16px;
  margin-bottom:14px;
  outline:none;
}
input:focus{border-color:#6b4a31;box-shadow:0 0 0 3px rgba(107,74,49,.12)}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#6b4a31;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
button:hover{background:#583c29}
#errorMessage{color:#d93025;margin-top:14px;min-height:20px}
#welcomePage{display:none}
.success{color:#2f7d4a;font-weight:700;margin-bottom:18px}
</style>
